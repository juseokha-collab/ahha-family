<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AHHA Family · 우리 가족 일상 기록</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>">
<style>
:root{
  --bg:#12121a; --panel:#1b1b26; --panel2:#232331; --text:#eeeef2; --muted:#9a97ab;
  --accent:#ff7a94; --accent2:#8b7cf6; --border:#2b2b3a; --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --weekend-sun:#ff9494; --weekend-sat:#8ab4ff; --sel-bg:#2a2130; --accent-soft:rgba(255,122,148,.16);
}
:root[data-theme="light"]{
  --bg:#f6f5fa; --panel:#ffffff; --panel2:#f1eef8; --text:#201f2b; --muted:#726f82;
  --accent:#b25a78; --accent2:#7a70a8; --border:#e3e0ee; --good:#1f9d55; --warn:#b8790a; --bad:#d63c3c;
  --weekend-sun:#c73a5c; --weekend-sat:#3b6fd4; --sel-bg:#ece4f3; --accent-soft:rgba(178,90,120,.14);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;transition:background .2s,color .2s;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
.wrap{max-width:920px;margin:0 auto;padding:16px 14px 80px;}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 10px;}
.brand{display:flex;flex-direction:column;}
.brand .name{font-size:22px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.heart-icon{font-size:20px;line-height:1;}
.heart-icon.heart-sparkle{animation:heart-sparkle-pulse 1.1s ease-in-out 3;}
@keyframes heart-sparkle-pulse{
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,122,148,0));}
  50%{transform:scale(1.35);filter:drop-shadow(0 0 6px rgba(255,122,148,.9));}
}
.header-right{display:flex;align-items:center;gap:8px;}
.auth-area{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;transition:.15s;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#181820;font-weight:700;}
:root[data-theme="light"] .btn.primary{background:var(--accent);color:#ffffff;}
.btn.small{padding:5px 9px;font-size:12px;border-radius:8px;}
.btn.danger{color:var(--bad);}
.btn.active{border-color:var(--accent);color:var(--accent);font-weight:700;}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 14px;}
nav.tabs button{flex:0 0 auto;background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;}
nav.tabs button.active{background:var(--panel2);color:var(--text);border-color:var(--accent);}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:6px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px;}
.field label{font-size:11px;color:var(--muted);}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;}
.field textarea{resize:vertical;min-height:44px;}
.time10-pair{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:0 4px;height:34px;box-sizing:border-box;display:flex;align-items:center;}
.day-toggle-btn{background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:11px;padding:0 10px;cursor:pointer;flex-shrink:0;height:34px;box-sizing:border-box;}
.day-toggle-btn:hover{border-color:var(--accent);}
.field select.time10-select{background:none;border:none;padding:8px 2px;flex:1;min-width:0;text-align:center;}
.time10-ap-toggle{background:none;border:none;padding:8px 4px;flex-shrink:0;text-align:center;font-size:13px;font-family:inherit;color:var(--text);cursor:pointer;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:600px){.grid2{grid-template-columns:1fr;}}
.meal-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(min-width:601px){.meal-card-grid{grid-template-columns:repeat(4,1fr);}}
.meal-card{position:relative;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;height:150px;overflow:hidden;box-sizing:border-box;}
.meal-card-done{background:#1c1c22;border-color:#1c1c22;}
.meal-card-done .meal-card-preview{color:#f0f0f3;}
.meal-card-done .meal-card-label{color:#f0f0f3;}
.meal-card-done .meal-status-bold{color:#f0f0f3;}
.meal-card-done .meal-card-edit{color:#a9a9b2;}
.meal-card-photo{border-color:transparent;background:#fff;}
.meal-card-done.meal-card-photo{background:#fff;}
.meal-card-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.meal-card-overlay{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0.15),rgba(0,0,0,0.32));z-index:1;}
.meal-card-photo .meal-card-top,.meal-card-photo .meal-card-label,.meal-card-photo .meal-card-status{position:relative;z-index:2;}
.meal-card-photo .meal-card-preview{color:#fff;-webkit-text-stroke:0.25px rgba(0,0,0,0.4);text-shadow:-0.5px -0.5px 0 rgba(0,0,0,0.4),0.5px -0.5px 0 rgba(0,0,0,0.4),-0.5px 0.5px 0 rgba(0,0,0,0.4),0.5px 0.5px 0 rgba(0,0,0,0.4);}
.meal-card-photo .meal-card-label{color:#fff;-webkit-text-stroke:0.25px rgba(0,0,0,0.4);text-shadow:-0.5px -0.5px 0 rgba(0,0,0,0.4),0.5px -0.5px 0 rgba(0,0,0,0.4),-0.5px 0.5px 0 rgba(0,0,0,0.4),0.5px 0.5px 0 rgba(0,0,0,0.4);}
.meal-card-photo .meal-status-bold{color:#fff;-webkit-text-stroke:0.25px rgba(0,0,0,0.4);text-shadow:-0.5px -0.5px 0 rgba(0,0,0,0.4),0.5px -0.5px 0 rgba(0,0,0,0.4),-0.5px 0.5px 0 rgba(0,0,0,0.4),0.5px 0.5px 0 rgba(0,0,0,0.4);}
.meal-card-photo .meal-card-edit{color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.7));}
.meal-card-photo .meal-card-icon{filter:drop-shadow(0 1px 2px rgba(0,0,0,0.7));}
.meal-card-top{display:flex;align-items:flex-start;gap:4px;flex-shrink:0;}
.meal-card-icon{font-size:22px;line-height:1;flex-shrink:0;}
.meal-card-edit{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:2px;flex-shrink:0;align-self:flex-end;line-height:1;}
.meal-card-edit:hover{color:var(--text);}
.meal-card-label{font-weight:700;font-size:15px;flex-shrink:0;margin-top:auto;}
.meal-card-preview{flex:1;min-width:0;align-self:stretch;font-size:14px;color:var(--text);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.meal-card-preview.empty{color:var(--muted);font-size:10.5px;}
.meal-card-status{font-size:12.5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.meal-card-check{background:none;border:none;font-size:14px;cursor:pointer;padding:0;width:18px;height:18px;flex-shrink:0;line-height:1;}
.meal-card-check:disabled{cursor:default;}
.meal-status-bold{font-weight:700;color:var(--text);}
.meal-status-muted{color:var(--muted);}
.meal-mood-icon{width:70px;height:70px;border-radius:12px;object-fit:contain;flex-shrink:0;}
.meal-history-grid{display:grid;grid-template-columns:auto 1fr;column-gap:6px;row-gap:2px;align-items:baseline;flex:1;min-width:0;}
.list-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.meta{font-size:11px;color:var(--muted);}
.list-item .meta{margin-top:2px;}
.content-text{font-size:13px;color:var(--text);}
.list-item .content-text{margin-top:2px;}
.sched-item{background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:8px;border-bottom:none;}
.sched-item:last-child{margin-bottom:0;}
.pill{display:inline-block;position:relative;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--border);}
.pill:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--text);font-weight:600;}
.pill.d-urgent{color:var(--bad);border-color:var(--bad);}
.pill.d-soon{color:var(--warn);border-color:var(--warn);}
.pill.d-far{color:var(--good);border-color:var(--good);}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 0;}
.mood-row{display:flex;gap:25px;flex-wrap:nowrap;justify-content:flex-end;}
.mood-row button{flex:0 0 auto;background:none;border:none;border-radius:8px;width:50px;height:50px;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mood-row button img{width:100%;height:100%;object-fit:cover;transform:scale(1.18);}
.mood-row button.sel{background:var(--sel-bg);}
@media(max-width:420px){
  .mood-row{gap:6px;}
  .mood-row button{height:30px;width:30px;border-radius:5px;}
  #homeDateMoodRow{flex-wrap:wrap !important;}
  #moodRow{width:100%;margin-top:6px;overflow-x:visible;}
}
.happycomment-icon-wrap{width:100px;height:100px;flex-shrink:0;border-radius:12px;overflow:hidden;display:inline-block;}
.happycomment-icon-wrap img{width:100%;height:100%;object-fit:contain;}
.datebar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
.datebar .d{font-size:12px;font-weight:700;white-space:nowrap;}
button.iconbtn{background:transparent;border:none;color:var(--text);border-radius:8px;width:32px;height:32px;flex-shrink:0;padding:0;font-size:18px;}
button.iconbtn:hover{color:var(--accent);}
.datebar .btn.small{white-space:nowrap;flex-shrink:0;}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:640px){.budget-stat-grid{grid-template-columns:1fr 1.15fr 1fr 1fr;}}
.stat{background:var(--panel2);border-radius:12px;padding:12px;text-align:center;}
.stat .v{font-size:15px;font-weight:800;margin-top:2px;}
.stat .l{font-size:11px;color:var(--muted);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-head{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;}
.cal-cell{min-height:64px;border-radius:8px;background:transparent;border:1px solid var(--border);font-size:12px;padding:4px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;position:relative;cursor:pointer;overflow:hidden;}
.cal-cell.today{border-color:var(--accent);}
.cal-cell.sel{background:var(--sel-bg);border-color:var(--accent2);}
.cal-cell.other{opacity:.3;}
.day-row{display:flex;align-items:baseline;gap:4px;width:100%;overflow:hidden;}
.cal-cell .day-num{color:var(--muted);flex-shrink:0;}
.cal-cell.today .day-num{color:var(--accent);font-weight:700;}
.cal-grid>.cal-head:nth-child(7n+1),.cal-grid>.cal-cell:nth-child(7n+1) .day-num{color:var(--weekend-sun);}
.cal-grid>.cal-head:nth-child(7n),.cal-grid>.cal-cell:nth-child(7n) .day-num{color:var(--weekend-sat);}
.cal-cell.holiday .day-num{color:var(--weekend-sun);}
.cal-cell.today .day-num{color:var(--accent)!important;}
.cal-holiday{font-size:9px;color:var(--weekend-sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-comment{font-size:10px;font-weight:700;color:var(--accent);background:var(--panel);border-radius:4px;padding:1px 4px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-evt{display:block;font-size:10px;background:var(--panel);border-radius:4px;padding:1px 4px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);cursor:pointer;}
.cal-evt.more{color:var(--muted);background:none;padding:0 4px;cursor:default;}
@media(max-width:600px){.cal-cell{min-height:52px;}.cal-evt{font-size:9px;}}
@media(max-width:600px){
  .shop-draft-row{gap:4px !important;}
  .shop-draft-cat{width:78px !important;padding:6px 6px !important;font-size:12px !important;}
  .shop-draft-items{min-width:70px !important;padding:6px 6px !important;font-size:12px !important;}
  .shop-draft-save{padding:6px 8px !important;font-size:12px !important;}
}
.maint-table{width:100%;border-collapse:collapse;font-size:12px;}
.maint-table th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
.maint-table td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap;}
.maint-table td.wrap{white-space:normal;}
.maint-table tr:last-child td{border-bottom:none;}
.maint-table tr.empty-row td{color:var(--muted);}
.cycle-input{width:90px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 7px;font-size:11px;}
.icon-btn{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 8px;border-radius:6px;}
.icon-btn:hover{color:var(--accent);background:var(--panel2);}
.link-btn{background:none;border:none;color:var(--accent2);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;}
input.date-input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;}
input.date-input::placeholder{color:var(--muted);}
input.date-input{cursor:pointer;background:var(--panel2) url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%239a97ab%22 stroke-width=%222%22><rect x=%223%22 y=%224%22 width=%2218%22 height=%2218%22 rx=%222%22/><line x1=%2216%22 y1=%222%22 x2=%2216%22 y2=%226%22/><line x1=%228%22 y1=%222%22 x2=%228%22 y2=%226%22/><line x1=%223%22 y1=%2210%22 x2=%2221%22 y2=%2210%22/></svg>') no-repeat right 10px center/16px 16px;padding-right:34px;}
.datepicker-pop{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);width:250px;z-index:200;}
.datepicker-pop .cal-grid{gap:2px;}
.datepicker-pop .cal-cell{min-height:30px;padding:2px;font-size:11px;cursor:pointer;}
.datepicker-pop .cal-cell .day-row{justify-content:center;}
.datepicker-pop .datebar{margin-bottom:6px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal-bg.show{display:flex;}
.modal{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;cursor:grab;}
.modal.dragging{cursor:grabbing;}
.modal h3{margin-top:0;}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 9px;border-radius:8px;line-height:1;}
.modal-close:hover{color:var(--text);background:var(--panel2);}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;}
.toast.show{opacity:1;}
.section-title{font-size:13px;color:var(--muted);margin:18px 0 8px 2px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
.bar-track{flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.dt-panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px;}
.dt-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:11px;min-width:360px;}
.dt-table th{padding:6px 4px;text-align:left;font-size:12px;color:var(--text);border-bottom:1px solid var(--border);}
.dt-table td{border-bottom:1px solid var(--border);padding:2px 4px;vertical-align:top;height:22px;border-left:none;border-right:none;}
.dt-time-col{width:48px;color:var(--muted);font-size:10px;white-space:nowrap;text-align:right;padding-right:6px!important;}
.dt-hl{color:var(--text);font-weight:700;}
.dt-edge-row td{height:44px;}
.dt-cell{cursor:pointer;}
.dt-table td.dt-gap,.dt-table th.dt-gap{width:10px;min-width:10px;padding:0;border:none;background:transparent;}
.dt-cell:hover{background:var(--sel-bg);}
.dt-cell.dt-dragover{outline:2px dashed var(--accent);outline-offset:-2px;}
.dt-cell.dt-edge{opacity:.92;}
.dt-cell.filled{background:var(--accent-soft);}
.dt-tooltip{position:fixed;z-index:300;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text);max-width:240px;box-shadow:0 4px 16px rgba(0,0,0,.35);pointer-events:none;white-space:pre-wrap;}
.dt-evt{background:rgba(255,173,173,0.35);color:var(--text);border:none;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:600;margin-bottom:2px;cursor:pointer;display:inline-block;}
.dt-evt.dt-evt-common{background:rgba(189,178,255,0.35);color:var(--text);}
.author-badge{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;font-size:10px;line-height:1;margin-right:3px;vertical-align:middle;}
.sb-table td.sb-cell{padding:0;border-bottom:1px solid var(--border);}
.sb-summary-cell{background:var(--panel2);text-align:center;font-size:12.5px;line-height:1.5;padding:6px 4px;font-weight:400;border-bottom:1px solid var(--border);}
.sb-summary-row .dt-time-col{border-bottom:1px solid var(--border);}
.sb-gap-row td{height:10px;background:var(--panel)!important;border:none!important;padding:0!important;}
.sb-row{display:flex;height:18px;}
.sb-seg{flex:1;cursor:pointer;border-right:1px solid var(--bg);background:var(--panel2);}
.sb-seg:last-child{border-right:none;}
.sb-seg:hover{outline:1px solid var(--accent);outline-offset:-1px;}
.sb-seg.sb-study{background:#f5d76e;}
.sb-seg.sb-exercise{background:#7ee787;}
.dt-evt:hover{filter:brightness(1.08);}
.dt-evt[data-virtual]{background:var(--panel2);color:var(--text);border:1px solid var(--border);font-weight:400;}
.dt-evt[data-virtual].dt-evt-dday-common{background:rgba(189,178,255,0.35);color:var(--text);border:none;}
.dtp-wrap{display:flex;align-items:flex-start;min-width:360px;}
.dtp-timecol{width:44px;flex-shrink:0;color:var(--muted);font-size:10px;text-align:right;padding-right:6px;box-sizing:border-box;position:relative;}
.dtp-gap{width:10px;flex-shrink:0;}
.dtp-daycol{flex:1;min-width:110px;}
.dtp-head{height:26px;font-size:12px;}
.dtp-edge{font-size:10px;color:var(--muted);min-height:34px;padding:3px 0;line-height:1.3;box-sizing:border-box;}
.dtp-prop{position:relative;border-top:1px solid var(--border);}
.dtp-hourband{position:absolute;left:0;right:0;border-bottom:1px solid var(--border);box-sizing:border-box;}
.dtp-timelabel{position:absolute;right:0;transform:translateY(-50%);font-size:10px;color:var(--muted);white-space:nowrap;}
.habit-row{padding:5px 0;border-bottom:1px solid var(--border);}
.habit-row:last-child{border-bottom:none;}
.habit-row-head{display:flex;align-items:center;gap:6px;margin-bottom:3px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;}
.habit-icon{font-size:15px;flex-shrink:0;}
.habit-row-name{font-size:12.5px;font-weight:600;flex-shrink:0;}
.habit-row-streak{flex-shrink:0;white-space:nowrap;}
.habit-row-head .icon-btn{flex-shrink:0;}
.habit-move-btns{width:32px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:0;}
.habit-move-btns .icon-btn{font-size:11px;padding:0;line-height:1.4;width:100%;}
.habit-move-btns .icon-btn:disabled{opacity:0.25;cursor:default;}
.habit-cells{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.habit-cells-spacer{width:32px;flex-shrink:0;}
.habit-cell-col{min-width:0;display:flex;justify-content:center;opacity:0.5;transition:opacity .15s;}
.habit-cell-col.habit-col-current{opacity:1;}
.habit-cell{width:28px;flex-shrink:0;height:26px;font-size:13px;background:var(--panel2);border:none;border-radius:7px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;}
.habit-cell.habit-done{background:rgba(74,222,128,.18);}
.habit-cell.habit-undone{background:rgba(248,113,113,.12);}
.habit-cell.habit-done.habit-weekly{background:rgba(139,124,246,.22);}
span.habit-cell.habit-future{background:none;color:var(--muted);cursor:default;}
.habit-icon-pick{width:32px;height:32px;font-size:17px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;cursor:pointer;padding:0;}
.habit-icon-pick.sel{border-color:var(--accent);background:var(--sel-bg);}
.habit-ring-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0;}
.habit-ring-col{min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0.5;transition:opacity .15s;}
.habit-ring-col.habit-col-current{opacity:1;}
.habit-ring-date{font-size:9.5px;color:var(--muted);white-space:nowrap;}
.habit-today-badge{display:inline-block;background:#000;color:#fff;border-radius:999px;padding:1px 6px;font-size:8px;font-weight:700;white-space:nowrap;}
.habit-today-slot{height:14px;display:flex;align-items:center;justify-content:center;}
button.iconbtn.habit-nav-btn{color:var(--good);}
button.iconbtn.habit-nav-btn.habit-nav-btn-weekly{color:var(--accent2);}
.confetti-burst{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.confetti-piece{position:absolute;top:-10px;left:calc(50% + (var(--i) - 12) * 14px);width:8px;height:14px;border-radius:2px;background:hsl(var(--hue) 80% 60%);opacity:0;animation:confetti-fall 1.4s ease-in forwards;animation-delay:calc(var(--i) * 0.02s);}
@keyframes confetti-fall{
  0%{opacity:1;transform:translateY(0) rotate(0deg);}
  100%{opacity:0;transform:translateY(170px) rotate(420deg);}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="row" style="align-items:baseline;gap:8px;">
        <div class="name">AHHA Fam</div><span id="heartIcon" class="heart-icon">💗</span>
        <span id="worldClock" class="sub" style="margin:0;font-size:15px;"></span>
      </div>
      <div class="sub">하루하루를 담다</div>
    </div>
    <div class="header-right">
      <div class="auth-area" id="authArea">
        <button class="btn small" id="loginBtn">구글 로그인</button>
      </div>
      <button class="btn small" id="themeToggle" title="테마 전환">🌙</button>
      <button class="btn small" id="viewAsMomBtn" data-role="mom" title="아내가 보는 화면 미리보기">아내</button>
      <button class="btn small" id="viewAsDaughterBtn" data-role="daughter" title="딸이 보는 화면 미리보기">딸</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="home" class="active">홈</button>
    <button data-tab="schedule">일정</button>
    <button data-tab="health">건강</button>
    <button data-tab="budget">가계부</button>
    <button data-tab="vehicle">차량</button>
    <button data-tab="events">경조사</button>
  </nav>

  <div id="tab-home"></div>
  <div id="tab-schedule" style="display:none"></div>
  <div id="tab-health" style="display:none"></div>
  <div id="tab-budget" style="display:none"></div>
  <div id="tab-vehicle" style="display:none"></div>
  <div id="tab-events" style="display:none"></div>
  <div id="tab-study" style="display:none"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal"><button class="modal-close" id="modalCloseBtn" title="닫기">✕</button><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20260819p"></script>
<script src="app.js?v=20260819p"></script>
</body>
</html>
