<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AHHA Family · 우리 가족 일상 기록</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>">
<style>
:root{
  --bg:#12121a; --panel:#1b1b26; --panel2:#232331; --text:#eeeef2; --muted:#9a97ab;
  --accent:#ff7a94; --accent2:#8b7cf6; --border:#2b2b3a; --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --weekend-sun:#ff9494; --weekend-sat:#8ab4ff; --sel-bg:#2a2130;
}
:root[data-theme="light"]{
  --bg:#f6f5fa; --panel:#ffffff; --panel2:#f1eef8; --text:#201f2b; --muted:#726f82;
  --accent:#b25a78; --accent2:#7a70a8; --border:#e3e0ee; --good:#1f9d55; --warn:#b8790a; --bad:#d63c3c;
  --weekend-sun:#c73a5c; --weekend-sat:#3b6fd4; --sel-bg:#ece4f3;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;transition:background .2s,color .2s;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
.wrap{max-width:920px;margin:0 auto;padding:16px 14px 80px;}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 10px;}
.brand{display:flex;flex-direction:column;}
.brand .name{font-size:22px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:8px;}
.auth-area{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;transition:.15s;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#181820;font-weight:700;}
:root[data-theme="light"] .btn.primary{background:var(--accent);color:#ffffff;}
.btn.small{padding:5px 9px;font-size:12px;border-radius:8px;}
.btn.danger{color:var(--bad);}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 14px;}
nav.tabs button{flex:0 0 auto;background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;}
nav.tabs button.active{background:var(--panel2);color:var(--text);border-color:var(--accent);}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:6px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px;}
.field label{font-size:11px;color:var(--muted);}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;}
.field textarea{resize:vertical;min-height:44px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:600px){.grid2{grid-template-columns:1fr;}}
.list-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.meta{font-size:11px;color:var(--muted);}
.list-item .meta{margin-top:2px;}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--border);}
.pill.d-urgent{color:var(--bad);border-color:var(--bad);}
.pill.d-soon{color:var(--warn);border-color:var(--warn);}
.pill.d-far{color:var(--good);border-color:var(--good);}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 0;}
.mood-row{display:flex;gap:8px;flex-wrap:nowrap;}
.mood-row button{flex:1;min-width:0;font-size:22px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;width:44px;height:44px;padding:0;}
.mood-row button.sel{border-color:var(--accent);background:var(--sel-bg);}
@media(max-width:420px){
  .mood-row{gap:4px;}
  .mood-row button{height:36px;font-size:16px;border-radius:8px;}
}
.datebar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
.datebar .d{font-size:16px;font-weight:700;white-space:nowrap;}
.datebar button.iconbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;width:32px;height:32px;flex-shrink:0;padding:0;}
.datebar .btn.small{white-space:nowrap;flex-shrink:0;}
.member-row{display:flex;gap:6px;margin-bottom:12px;}
.member-row button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:8px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;}
.member-row button.active{color:var(--text);border-color:var(--accent);background:var(--sel-bg);}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
.stat{background:var(--panel2);border-radius:12px;padding:12px;text-align:center;}
.stat .v{font-size:18px;font-weight:800;}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-head{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;}
.cal-cell{min-height:64px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);font-size:12px;padding:4px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;position:relative;cursor:pointer;overflow:hidden;}
.cal-cell.today{border-color:var(--accent);}
.cal-cell.sel{background:var(--sel-bg);border-color:var(--accent2);}
.cal-cell.other{opacity:.3;}
.day-row{display:flex;align-items:baseline;gap:4px;width:100%;overflow:hidden;}
.cal-cell .day-num{color:var(--muted);flex-shrink:0;}
.cal-cell.today .day-num{color:var(--accent);font-weight:700;}
.cal-grid>.cal-head:nth-child(7n+1),.cal-grid>.cal-cell:nth-child(7n+1) .day-num{color:var(--weekend-sun);}
.cal-grid>.cal-head:nth-child(7n),.cal-grid>.cal-cell:nth-child(7n) .day-num{color:var(--weekend-sat);}
.cal-cell.holiday .day-num{color:var(--weekend-sun);}
.cal-cell.today .day-num{color:var(--accent)!important;}
.cal-holiday{font-size:9px;color:var(--weekend-sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-evt{font-size:10px;background:var(--panel);border-radius:4px;padding:1px 4px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.cal-evt.more{color:var(--muted);background:none;padding:0 4px;}
@media(max-width:600px){.cal-cell{min-height:52px;}.cal-evt{font-size:9px;}}
.maint-table{width:100%;border-collapse:collapse;font-size:12px;}
.maint-table th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
.maint-table td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap;}
.maint-table td.wrap{white-space:normal;}
.maint-table tr:last-child td{border-bottom:none;}
.maint-table tr.empty-row td{color:var(--muted);}
.cycle-input{width:90px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 7px;font-size:11px;}
.icon-btn{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 8px;border-radius:6px;}
.icon-btn:hover{color:var(--accent);background:var(--panel2);}
.link-btn{background:none;border:none;color:var(--accent2);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal-bg.show{display:flex;}
.modal{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;}
.modal h3{margin-top:0;}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 9px;border-radius:8px;line-height:1;}
.modal-close:hover{color:var(--text);background:var(--panel2);}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;}
.toast.show{opacity:1;}
.section-title{font-size:13px;color:var(--muted);margin:18px 0 8px 2px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
.bar-track{flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="name">AHHA Family 💗</div>
      <div class="sub">우리 가족의 하루하루를 담다</div>
    </div>
    <div class="header-right">
      <div class="auth-area" id="authArea">
        <button class="btn small" id="loginBtn">구글 로그인</button>
      </div>
      <button class="btn small" id="themeToggle" title="테마 전환">🌙</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="home" class="active">홈</button>
    <button data-tab="schedule">일정</button>
    <button data-tab="health">건강</button>
    <button data-tab="budget">가계부</button>
    <button data-tab="vehicle">차량</button>
    <button data-tab="events">경조사</button>
  </nav>

  <div id="tab-home"></div>
  <div id="tab-schedule" style="display:none"></div>
  <div id="tab-health" style="display:none"></div>
  <div id="tab-budget" style="display:none"></div>
  <div id="tab-vehicle" style="display:none"></div>
  <div id="tab-events" style="display:none"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal"><button class="modal-close" id="modalCloseBtn" title="닫기">✕</button><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20260808n"></script>
<script src="app.js?v=20260808n"></script>
</body>
</html>
